<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Burger Login | เข้าสู่ระบบจัดการร้าน</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .login-body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fffcf9 0%, #ffe8d6 100%);
        }
        .login-card {
            background: white;
            padding: 50px;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(255, 107, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .login-card h2 {
            font-size: 2rem;
            margin-bottom: 30px;
            color: var(--primary);
        }
        .login-card .form-group {
            text-align: left;
            margin-bottom: 25px;
        }
    </style>
</head>
<body class="login-body">
    <div class="login-card">
        <div class="logo" style="justify-content: center; margin-bottom: 20px; font-size: 2.2rem;">
            <i data-lucide="utensils-crossed"></i>
            Homie Boy
        </div>
        <h2>เข้าสู่ระบบผู้จัดการ</h2>
        <form id="login-form">
            <div class="form-group">
                <label>ชื่อผู้ใช้งาน</label>
                <input type="text" id="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <label>รหัสผ่าน</label>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <p id="login-error" style="color: #ff5252; font-size: 0.9rem; margin-bottom: 15px; display: none;">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</p>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px;">เข้าสู่ระบบ</button>
        </form>
        <a href="index.html" style="display: block; margin-top: 20px; color: var(--text-light); text-decoration: none; font-size: 0.9rem;">กลับหน้าหลัก</a>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>

    <script src="login.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
